# One portal serving every vault, run locally — builds from this checkout, no
# tunnel. Each vault is at /v/<slug>/mcp (the first one also at /mcp); add
# vaults from the switcher's "Manage vaults…" in the UI.
#
# From the repo root:
#   docker compose -f deploy/docker-compose.local.yml up -d --build
#   docker compose -f deploy/docker-compose.local.yml logs app   ← setup token
# then open http://localhost:3000/setup (APP_PORT=3100 to use another port).
#
# Passkeys work on http://localhost (browser secure-context exception). With no
# PUBLIC_URL set, the app derives its origin from the request.
# Data persists in deploy/data/app (gitignored); vaults beyond the first live
# under deploy/data/app/vaults/<slug>/.

# Named explicitly: compose otherwise names the project after this folder
# ("deploy"), so another checkout's deploy/ would replace these containers.
name: obsidian-mcp-app

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: obsidian-mcp:app
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./data/app:/data
