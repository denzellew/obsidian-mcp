
# PUBLIC_URL stays unset so each service derives its origin from the hostname
# Cloudflare forwarded. The two data directories must never be shared.
# Both services run the same image; MCP_PROFILE selects the personal API.

x-mcp: &mcp
  build:
    context: ..
    dockerfile: Dockerfile
  image: obsidian-mcp:local
  restart: unless-stopped
  stop_grace_period: 30s

services:
  knowledge-vault:
    <<: *mcp
    volumes:
      - ./data/knowledge:/data

  personal-context:
    <<: *mcp
    environment:
      MCP_PROFILE: personal-context
    volumes:
      - ./data/personal:/data

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - knowledge-vault
      - personal-context
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN}