[tools]
# Exact-pinned for reproducible dev/build; bump deliberately via the upgrade skill.
bun = "1.3.14"
node = "24.16.0"

[env]
DATA_DIR = "{{config_root}}/data"
# PUBLIC_URL intentionally unset: dev runs in proxy-derived mode, matching
# production. Direct localhost hits resolve to http://localhost:3000; requests
# through a tunnel use the forwarded host. Set it only to hard-pin the origin.

[tasks."dev:server"]
run = "bun --watch src/server.ts"

[tasks."dev:css"]
run = "bunx @tailwindcss/cli -i styles/app.css -o public/app.css --watch"

[tasks.dev]
depends = ["dev:server", "dev:css"]

# Dev-only: run whichever reverse tunnels are configured (gatecrash and/or
# cloudflared) to expose the local dev server. Production uses compose sidecars.
[tasks.tunnel]
description = "Run configured dev tunnels (gatecrash/cloudflared) to the local server"
run = "bun scripts/tunnel.ts"

[tasks.doctor]
description = "Show dev environment diagnostics (toolchain, config, data, tunnels, server)"
run = "bun scripts/doctor.ts"

[tasks.test]
run = "bun test"

[tasks.typecheck]
run = "bunx tsc --noEmit"

[tasks.build]
run = [
  "bunx @tailwindcss/cli -i styles/app.css -o public/app.css --minify",
  "bun build src/server.ts --target=bun --outdir=dist",
]

[tasks."docker:build"]
run = "docker build -t ghcr.io/jclement/obsidian-mcp:dev ."

# optional: install the real obsidian-headless client for local sync testing
[tasks."ob:install"]
run = "npm install -g obsidian-headless"
